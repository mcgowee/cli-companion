<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CLI Companion</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%237c6cff'/%3E%3Ctext x='16' y='23' font-family='Georgia' font-size='20' text-anchor='middle' fill='white'%3E%CF%80%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="menubar">
    <a class="brand" href="#/"><span class="logo">&gt;_</span> CLI Companion</a>
    <nav class="menu" aria-label="Main">
      <a class="menu-item" href="#/" data-page="home">Home</a>
      <a class="menu-item" href="#/dashboards" data-page="dashboards">Dashboards</a>
      <a class="menu-item" href="#/about" data-page="about">About</a>
    </nav>
  </header>

  <section class="page" id="page-dashboards" hidden>
    <div class="page-inner">
      <h1>Dashboards</h1>
      <p class="page-lead">Nothing here yet.</p>
    </div>
  </section>

  <section class="page" id="page-about" hidden>
    <div class="page-inner" id="about-body">
      <h1>About CLI Companion</h1>
    </div>
  </section>

  <div class="app" id="page-home">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-top">
        <div class="conn" id="conn"><span class="dot"></span><span id="conn-text">Connecting…</span></div>
        <button class="icon-btn" id="sidebar-hide" type="button" aria-label="Hide sidebar" title="Hide sidebar (Ctrl+B)">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2.5"/><path d="M9.5 4v16"/></svg>
        </button>
      </div>

      <nav class="side-nav" aria-label="Views">
        <button class="nav-item active" type="button" data-view="workspaces" aria-current="page">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 7.5a2 2 0 0 1 2-2h3.6l2 2h7.4a2 2 0 0 1 2 2v7.5a2 2 0 0 1-2 2h-13a2 2 0 0 1-2-2z"/></svg>
          <span>Workspaces</span>
        </button>
      </nav>

      <div class="sessions-head">
        <input id="filter" class="filter" type="search" placeholder="Filter workspaces and sessions" aria-label="Filter workspaces and sessions">
      </div>
      <nav id="session-list" class="session-list" aria-label="Workspaces and sessions"></nav>
      <p class="hint" id="empty-hint">No Pi sessions found yet. Start <code>pi</code> in a terminal; running sessions show up here within 15&nbsp;seconds.</p>
    </aside>

    <div class="panel-resize side-resize" id="side-resize" role="separator" aria-orientation="vertical"
      aria-label="Resize left panel" tabindex="0" title="Drag to resize · double-click to reset"></div>

    <button class="icon-btn sidebar-show" id="sidebar-show" type="button" aria-label="Show sidebar" title="Show sidebar (Ctrl+B)">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2.5"/><path d="M9.5 4v16"/></svg>
    </button>

    <main class="main">
      <header class="topbar" id="topbar" hidden>
        <div class="title-block">
          <h1 id="session-title">—</h1>
          <div class="meta" id="session-meta"></div>
        </div>
        <div class="status-block">
          <div class="context" id="context" title="Context used">
            <div class="context-bar"><div class="context-fill" id="context-fill"></div></div>
            <span id="context-text"></span>
          </div>
          <span class="pill" id="status-pill">Idle</span>
          <button class="icon-btn" id="wb-toggle" type="button" aria-label="Files and review panel" title="Files and review (Ctrl+Alt+B)">
            <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2.5"/><path d="M14.5 4v16"/></svg>
          </button>
        </div>
      </header>

      <section class="banner" id="compaction-banner" hidden>
        <div class="spinner"></div>
        <div>
          <strong>Compacting context…</strong>
          <span id="compaction-detail"></span>
        </div>
        <span class="timer" id="compaction-timer">0:00</span>
      </section>

      <section class="transcript" id="transcript" aria-live="polite">
        <div class="placeholder" id="placeholder">Pick a session on the left.</div>
      </section>

      <section class="live" id="live"></section>

      <section class="composer" id="composer" aria-label="Composer">
        <button class="jump" id="jump" hidden>Jump to latest ↓</button>
        <div class="composer-head">
          <button class="composer-toggle" id="composer-toggle" type="button" aria-expanded="true" aria-controls="composer-body">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
            <span id="composer-title">Composer</span>
          </button>
          <span class="composer-target" id="composer-target"></span>
          <span class="composer-status" id="composer-status" role="status" aria-live="polite"></span>
        </div>
        <div class="composer-body" id="composer-body">
          <div class="slash-menu" id="slash-menu" role="listbox" aria-label="Slash commands" hidden></div>
          <textarea id="composer-text" rows="3" spellcheck="false" aria-label="Composer text"
            placeholder="Write or paste here, or click Add on code, messages, files and diffs. Type / for commands."></textarea>
          <div class="composer-actions">
            <button class="btn" id="composer-clear" type="button">Clear</button>
            <button class="btn primary" id="composer-send" type="button">Put in Pi's input <kbd>Ctrl+Enter</kbd></button>
          </div>
        </div>
      </section>
    </main>

    <aside class="workbench" id="workbench" aria-label="Files and review" hidden>
      <div class="panel-resize wb-resize" id="wb-resize" role="separator" aria-orientation="vertical"
        aria-label="Resize right panel" tabindex="0" title="Drag to resize · double-click to reset"></div>
      <div class="wb-tabs" role="tablist">
        <button class="wb-tab" type="button" role="tab" data-tool="files">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 3.5H7a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8.5z"/><path d="M14 3.5v5h5"/></svg>
          Files
        </button>
        <button class="wb-tab" type="button" role="tab" data-tool="review">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 4v10"/><path d="M3 9h10"/><path d="M11 19h10"/><path d="M18 4l-12 16"/></svg>
          Review
        </button>
        <span class="wb-spacer"></span>
        <button class="icon-btn" id="wb-close" type="button" aria-label="Close panel" title="Close (Ctrl+Alt+B)">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </div>
      <div class="wb-body" id="wb-files" role="tabpanel"></div>
      <div class="wb-body" id="wb-review" role="tabpanel" hidden></div>
    </aside>
  </div>
  <script src="markdown.js"></script>
  <script src="resize.js"></script>
  <script src="composer.js"></script>
  <script src="app.js"></script>
  <script src="workbench.js"></script>
  <script src="menu.js"></script>
</body>
</html>
